name: Contributor level tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contributor-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_contributor_levels.py -v
