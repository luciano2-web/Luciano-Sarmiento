name: 🏆 Niveles de colaboradores

on:
  pull_request_target:
    types: [closed]
  issues:
    types: [closed]
  schedule:
    - cron: "0 6 * * 1"   # recálculo semanal (inactividad)
  workflow_dispatch:        # ejecución manual

permissions:
  contents: write
  issues: write

# Evita que dos ejecuciones del bot publiquen cambios simultáneamente.
concurrency:
  group: update-levels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-levels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Actualizar niveles y badges
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python scripts/update_levels.py

      - name: Publicar cambios en CONTRIBUTORS.md y README
        run: |
          git config user.name "felix-gato-bot"
          git config user.email "actions@github.com"
          git add CONTRIBUTORS.json CONTRIBUTORS.md README.md
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "🤖 niveles: actualiza contribuciones, niveles y badges"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "No se pudo publicar tras tres intentos seguros." >&2
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
          fi
